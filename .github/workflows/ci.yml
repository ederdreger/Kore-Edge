name: laboratory checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - run: go vet ./...
      - run: test -z "$(gofmt -l cmd internal tests)"
      - run: for script in scripts/*.sh; do bash -n "$script"; done
      - name: Extract Nginx for isolated gateway tests (no package installation)
        run: |
          mkdir -p "$RUNNER_TEMP/kore-nginx"
          cd "$RUNNER_TEMP/kore-nginx"
          mkdir -p lists/partial cache/archives/partial
          apt_options=(-o "Dir::State::lists=$PWD/lists" -o "Dir::Cache=$PWD/cache"
            -o "Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources"
            -o "Dir::Etc::sourceparts=-")
          apt-get "${apt_options[@]}" update
          apt-get "${apt_options[@]}" download nginx apache2-utils libapr1t64 libaprutil1t64 wireguard-tools libmnl0
          for package in ./*.deb; do dpkg-deb -x "$package" root; done
          echo "KORE_EDGE_NGINX=$PWD/root/usr/sbin/nginx" >> "$GITHUB_ENV"
          echo "KORE_EDGE_HTPASSWD=$PWD/root/usr/bin/htpasswd" >> "$GITHUB_ENV"
          echo "KORE_EDGE_WG=$PWD/root/usr/bin/wg" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PWD/root/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"
      - name: Tests with the installer's restrictive umask
        run: |
          umask 077
          go test -race ./... -count=1 -timeout=180s
      - name: Portable FFmpeg for manual HLS compatibility (no system installation)
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/kore-manual-ffmpeg.tar.xz"
          curl --fail --location --retry 3 --max-time 180 'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-26-14-25/ffmpeg-n8.1.3-24-g92611900bb-linux64-gpl-8.1.tar.xz' -o "$archive"
          printf 'd113aa5b57ab0dcfee171d835240ce3ea5db826a0ee80ed7528c8d26a61e87a4  %s\n' "$archive" | sha256sum -c -
          mkdir -m 700 "$RUNNER_TEMP/kore-manual-ffmpeg"
          tar -xJf "$archive" --strip-components=1 -C "$RUNNER_TEMP/kore-manual-ffmpeg"
          umask 077
          KORE_MANUAL_FFMPEG="$RUNNER_TEMP/kore-manual-ffmpeg/bin/ffmpeg" go test -race ./internal/manualchannels -count=1 -timeout=90s
      - run: go test ./internal/provision -run '^TestConcurrentConsumptionAcrossRegistryInstances$' -count=50 -timeout=120s
      - run: go build ./cmd/...
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci && npm run check && npm test && npm run build
